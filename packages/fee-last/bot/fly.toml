# fly launch --dockerfile bot/Dockerfile --path packages/fee-last
app = "neat-fee-last-bot"
primary_region = "sin"

[build]
  dockerfile = "bot/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
