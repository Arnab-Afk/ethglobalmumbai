[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "solmate/=lib/v4-core/lib/solmate/",
    "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/"
]

fs_permissions = [{ access = "read-write", path = "./benchmark" }]

[profile.default.fuzz]
runs = 64

[rpc_endpoints]
base = "https://mainnet.base.org"
