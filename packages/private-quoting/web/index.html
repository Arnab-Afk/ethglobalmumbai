<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Private Competitive Quote</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --ok: #15803d; --warn: #b45309; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524; --line: #44403c; --ok: #4ade80; --warn: #fbbf24; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
    select, input, button { font: inherit; width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    button { background: var(--fg); color: var(--bg); border: 0; cursor: pointer; font-weight: 600; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
    dt { color: var(--muted); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; font-size: .8rem; padding: 2px 10px; border-radius: 99px; border: 1px solid currentColor; margin-bottom: 12px; }
    .ok { color: var(--ok); } .warn { color: var(--warn); }
    #status { color: var(--muted); font-size: .85rem; margin-top: 12px; min-height: 1.5em; }
    #verdict { font-weight: 600; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Private competitive quote</h1>
    <p class="sub">dWETH → dUSDC on the EIP-8141 devnet. The pool sets its fee last: just enough to beat the best venue. <a href="./diff.html">Compare direct vs Anon-RPC →</a></p>
    <div class="card">
      <span id="badge" class="badge"></span>
      <div class="row">
        <div><label for="worker">Anon-RPC network</label><select id="worker"></select></div>
        <div><label for="amount">Sell dWETH</label><input id="amount" type="number" min="0" step="any" value="10" /></div>
      </div>
      <button id="quote">Get quote</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <div class="card">
      <dl>
        <dt>Our fee</dt><dd id="fee">–</dd>
        <dt>You receive</dt><dd id="ours">–</dd>
        <dt>Best competing venue</dt><dd id="best">–</dd>
        <dt>Kept by LPs</dt><dd id="lp">–</dd>
      </dl>
      <div id="verdict"></div>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
